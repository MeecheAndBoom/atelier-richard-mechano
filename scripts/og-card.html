<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background:
      radial-gradient(1100px 600px at 18% -10%, #1d1d20 0%, transparent 60%),
      radial-gradient(900px 700px at 100% 110%, #16202e 0%, transparent 55%),
      #0b0b0d;
    color: #f5f5f7;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 64px 72px;
  }
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(1000px 560px at 70% 30%, #000 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(1000px 560px at 70% 30%, #000 30%, transparent 75%);
  }
  .brand { display: flex; align-items: center; gap: 20px; position: relative; }
  .mark {
    width: 72px; height: 72px; border-radius: 18px;
    background: #f5f5f7; display: grid; place-items: center;
  }
  .name { font-size: 34px; font-weight: 600; letter-spacing: -0.02em; }
  .name span { color: #86868b; font-weight: 400; }
  .tag {
    position: relative;
    font-size: 58px; line-height: 1.08; font-weight: 650; letter-spacing: -0.03em;
    max-width: 860px;
  }
  .tag em { font-style: normal; color: #2997ff; }
  .foot { display: flex; align-items: flex-end; justify-content: space-between; position: relative; }
  .url { font-size: 24px; color: #86868b; letter-spacing: 0.02em; }
  .pills { display: flex; gap: 12px; }
  .pill {
    font-size: 20px; color: #c7c7cc; border: 1px solid rgba(255,255,255,0.18);
    border-radius: 999px; padding: 10px 22px; background: rgba(255,255,255,0.05);
  }
</style>
</head>
<body>
  <div class="brand">
    <div class="mark">
      <svg width="46" height="46" viewBox="0 0 64 64">
        <g transform="translate(32 32) scale(0.15)" fill="none" stroke="#111111" stroke-width="28" stroke-linecap="round">
          <circle cx="0" cy="0" r="92"/><circle cx="0" cy="0" r="38"/>
          <line x1="92" y1="0" x2="136" y2="0"/><line x1="65" y1="65" x2="96" y2="96"/>
          <line x1="0" y1="92" x2="0" y2="136"/><line x1="-65" y1="65" x2="-96" y2="96"/>
          <line x1="-92" y1="0" x2="-136" y2="0"/><line x1="-65" y1="-65" x2="-96" y2="-96"/>
          <line x1="0" y1="-92" x2="0" y2="-136"/><line x1="65" y1="-65" x2="96" y2="-96"/>
        </g>
        <circle cx="32" cy="32" r="3.6" fill="#0071e3"/>
      </svg>
    </div>
    <div class="name">Atelier Richard <span>Méchano</span></div>
  </div>

  <div class="tag">Pièces détachées d’occasion<br />contrôlées, prêtes à <em>monter</em>.</div>

  <div class="foot">
    <div class="url">www.atelier-richard-mechano.com</div>
    <div class="pills">
      <div class="pill">Bilingue FR / EN</div>
      <div class="pill">Paiement sécurisé</div>
      <div class="pill">Lyon, France</div>
    </div>
  </div>
</body>
</html>
