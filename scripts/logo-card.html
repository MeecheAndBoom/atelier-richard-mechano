<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 512px; height: 512px; overflow: hidden; }
  body {
    background: radial-gradient(420px 420px at 30% 20%, #1c1c1f 0%, #0b0b0d 70%);
    display: grid;
    place-items: center;
    position: relative;
  }
  body::before {
    content: "";
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(300px 300px at 50% 45%, #000 35%, transparent 80%);
    -webkit-mask-image: radial-gradient(300px 300px at 50% 45%, #000 35%, transparent 80%);
  }
  .frame {
    width: 400px; height: 400px; border-radius: 84px; background: #f5f5f7;
    display: grid; place-items: center; position: relative;
    box-shadow: 0 30px 80px rgba(0,0,0,0.45);
  }
  .label {
    position: absolute; bottom: 26px; left: 0; right: 0; text-align: center;
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 20px; font-weight: 650; letter-spacing: 0.2em; color: #98989d;
  }
</style>
</head>
<body>
  <div class="frame">
    <svg width="260" height="260" viewBox="0 0 64 64">
      <g transform="translate(32 32) scale(0.155)" fill="none" stroke="#111111" stroke-width="27" stroke-linecap="round">
        <circle cx="0" cy="0" r="92"/><circle cx="0" cy="0" r="38"/>
        <line x1="92" y1="0" x2="136" y2="0"/><line x1="65" y1="65" x2="96" y2="96"/>
        <line x1="0" y1="92" x2="0" y2="136"/><line x1="-65" y1="65" x2="-96" y2="96"/>
        <line x1="-92" y1="0" x2="-136" y2="0"/><line x1="-65" y1="-65" x2="-96" y2="-96"/>
        <line x1="0" y1="-92" x2="0" y2="-136"/><line x1="65" y1="-65" x2="96" y2="-96"/>
      </g>
      <circle cx="32" cy="32" r="3.6" fill="#0071e3"/>
    </svg>
    <div class="label">MÉCHANO</div>
  </div>
</body>
</html>
